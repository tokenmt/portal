<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="180" height="160" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- 先绘圆（下层基准），后绘 ^（上层遮圆底） -->
  <circle cx="90" cy="50" r="42" fill="url(#sunrise)"/>
  <polyline points="30,140 55,95 80,140" fill="none" stroke="url(#caret)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,140 125,95 150,140" fill="none" stroke="url(#caret)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
